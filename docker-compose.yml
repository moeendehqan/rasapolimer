version: '3.8'

services:
  rasapolymer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rasapolymer
    ports:
      - "2100:2101"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - app-network

networks:
  app-network:
    driver: bridge