name: Docker Compose CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-up:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose up
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait for service
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4087 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - name: Show homepage
        run: curl -fsS http://localhost:4087 | head -n 30

      - name: Teardown
        if: always()
        run: |
          docker compose logs --no-color | tail -n 200
          docker compose down -v

  deploy:
    needs: build-and-up
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          strip_components: 0
          rm: true
          timeout: "60s"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: "60s"
          command_timeout: "30m"
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            export IMAGE="ghcr.io/${{ github.repository }}:latest"
            export GHCR_USER="${GHCR_USER:-${{ github.actor }}}"
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            cd ${{ secrets.DEPLOY_PATH }}
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "docker compose/docker-compose not found" >&2
              exit 1
            fi
            if [ -n "${GHCR_TOKEN}" ]; then
              docker login ghcr.io -u "${GHCR_USER}" -p "${GHCR_TOKEN}" || true
            fi
            docker pull "$IMAGE" || true
            $COMPOSE_CMD -f docker-compose.deploy.yml -f docker-compose.ci.yml up -d
            $COMPOSE_CMD ps
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:4087 >/dev/null; then
                break
              fi
              sleep 2
            done
            curl -fsS http://localhost:4087 | head -n 30 || true