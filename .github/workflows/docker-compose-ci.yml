name: Docker CI/CD Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | sed 's/\\n/\n/g' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      
      - name: Prepare and deploy
        run: |
          # انتقال فایل‌ها
          echo "📤 Copying files to server..."
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='*.log' \
            --delete \
            ./ root@${{ secrets.SSH_HOST }}:/var/www/rasapolymer/
          
          echo "🚀 Deploying on server..."
          
          # استفاده از single quotes برای heredoc و escaping صحیح
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              root@${{ secrets.SSH_HOST }} '
            set -e
            echo "Starting deployment..."
            
            cd /var/www/rasapolymer
            echo "Current directory: $(pwd)"
            echo "Directory contents:"
            ls -la
            
            # بررسی docker compose
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
              echo "Using: docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
              echo "Using: docker-compose"
            else
              echo "Error: docker compose not found!"
              exit 1
            fi
            
            echo "Building Docker image..."
            $COMPOSE_CMD build --no-cache
            
            echo "Stopping old containers..."
            $COMPOSE_CMD down --remove-orphans --timeout 30 2>/dev/null || true
            
            echo "Starting new containers..."
            $COMPOSE_CMD up -d
            
            echo "Waiting for service..."
            sleep 25
            
            # Health check
            echo "Health check..."
            MAX_RETRIES=30
            for i in $(seq 1 $MAX_RETRIES); do
              if curl -s -f http://localhost:2100 >/dev/null 2>&1; then
                echo "Service is healthy! (Attempt $i/$MAX_RETRIES)"
                echo "Service response:"
                curl -s -m 5 http://localhost:2100 | head -c 50 2>/dev/null || echo "No content"
                echo ""
                break
              fi
              echo "Waiting for service... ($i/$MAX_RETRIES)"
              sleep 3
            done
            
            echo "Final status:"
            $COMPOSE_CMD ps 2>/dev/null || docker ps
            
            echo ""
            echo "Deployment completed!"
          '