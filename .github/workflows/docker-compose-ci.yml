name: Docker CI/CD Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH with proper formatting
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # روش مطمئن: استفاده از Heredoc برای حفظ فرمت کلید
          cat > ~/.ssh/id_ed25519 << 'KEYEOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          KEYEOF
          
          # حذف کاراکترهای اضافه و اصلاح خطوط
          sed -i 's/\\n/\n/g' ~/.ssh/id_ed25519
          sed -i 's/\"//g' ~/.ssh/id_ed25519
          sed -i 's/^[[:space:]]*//' ~/.ssh/id_ed25519
          sed -i '/^$/d' ~/.ssh/id_ed25519
          
          chmod 600 ~/.ssh/id_ed25519
          
          # نمایش اطلاعات کلید برای دیباگ
          echo "=== Key Information ==="
          ls -la ~/.ssh/id_ed25519
          echo "First line of key:"
          head -1 ~/.ssh/id_ed25519
          echo "Last line of key:"
          tail -1 ~/.ssh/id_ed25519
          echo "=== End Key Info ==="
          
          # افزودن هاست به known_hosts
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          
          # تست اتصال
          echo "Testing SSH connection..."
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "echo '✅ SSH Connection Successful!'; echo 'User: $(whoami)'; echo 'Directory: $(pwd)'"
      
      - name: Prepare files for deployment (without tar)
        run: |
          # روش جایگزین: استفاده از rsync بدون tar
          echo "Preparing file list for deployment..."
          
          # ایجاد لیست فایل‌ها
          find . -type f \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./.github/*" \
            -not -name "*.log" \
            -not -name "deploy.tar.gz" \
            > files_to_deploy.txt
          
          echo "Files to deploy: $(wc -l < files_to_deploy.txt)"
          head -10 files_to_deploy.txt
      
      - name: Transfer files to server using rsync
        run: |
          # استفاده از rsync برای انتقال مستقیم فایل‌ها
          echo "Syncing files to server..."
          
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='*.log' \
            --exclude='deploy.tar.gz' \
            --delete \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
          
          echo "✅ Files synced successfully!"
      
      - name: Build and deploy Docker containers
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'DEPLOYEOF'
            set -e
            echo "🚀 Starting deployment process..."
            
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "\$DEPLOY_PATH"
            
            echo "📋 Checking current directory:"
            ls -la
            
            echo "🐳 Checking Docker version..."
            docker --version
            docker compose version || docker-compose --version
            
            echo "📦 Building Docker image..."
            if ! docker compose build --no-cache; then
              echo "❌ Docker build failed, trying with docker-compose..."
              docker-compose build --no-cache
            fi
            
            echo "🛑 Stopping old containers..."
            docker compose down --remove-orphans --timeout 30 2>/dev/null || \
            docker-compose down --remove-orphans --timeout 30 2>/dev/null || \
            echo "No running containers found or failed to stop"
            
            echo "▶️ Starting new containers..."
            docker compose up -d 2>/dev/null || \
            docker-compose up -d
            
            echo "⏳ Waiting for services to start..."
            sleep 10
            
            # بررسی سلامت سرویس
            echo "🏥 Health check..."
            MAX_RETRIES=15
            SERVICE_UP=false
            
            for i in \$(seq 1 \$MAX_RETRIES); do
              if curl -s -f http://localhost:2100 >/dev/null 2>&1; then
                echo "✅ Service is healthy! (Attempt \$i/\$MAX_RETRIES)"
                SERVICE_UP=true
                
                # نمایش اطلاعات اضافی
                echo "📊 Service info:"
                curl -s http://localhost:2100 | head -5 2>/dev/null || echo "Could not get service info"
                
                break
              fi
              
              echo "⏳ Waiting for service... (\$i/\$MAX_RETRIES)"
              sleep 3
            done
            
            if [ "\$SERVICE_UP" = "false" ]; then
              echo "⚠️ Service health check failed after \$MAX_RETRIES attempts"
              echo "📜 Container logs:"
              docker compose logs --tail=50 2>/dev/null || \
              docker-compose logs --tail=50 || \
              echo "Could not retrieve logs"
              
              echo "🐳 Docker container status:"
              docker ps -a
              
              # خطا نمی‌دهیم، فقط هشدار می‌دهیم
              echo "⚠️ Continuing despite health check failure..."
            fi
            
            # پاکسازی منابع قدیمی (اختیاری)
            echo "🧹 Cleaning up old resources..."
            docker system prune -f 2>/dev/null || true
            
            # نمایش وضعیت نهایی
            echo "📈 Final deployment status:"
            docker compose ps 2>/dev/null || \
            docker-compose ps || \
            docker ps --filter "name=rasapolymer"
            
            echo ""
            echo "🎉 Deployment process completed!"
            echo "🌐 Service should be available at: http://${{ secrets.SSH_HOST }}:2100"
            echo ""
            echo "📝 Quick test:"
            curl -s -m 10 http://localhost:2100 2>/dev/null | head -2 || \
            echo "Direct test failed, but service might still be starting"
          DEPLOYEOF
      
      - name: Verify remote deployment (optional)
        run: |
          echo "🔍 Performing remote verification..."
          
          # صبر برای راه‌اندازی کامل سرویس
          sleep 25
          
          # تست از خارج
          MAX_TRIES=5
          for i in \$(seq 1 \$MAX_TRIES); do
            echo "Verification attempt \$i/\$MAX_TRIES..."
            
            if curl -s -f --max-time 30 "http://${{ secrets.SSH_HOST }}:2100" > /dev/null 2>&1; then
              echo "✅ Remote verification successful!"
              echo "Service is responding correctly."
              
              # تست جزئیات بیشتر
              curl -s -m 10 "http://${{ secrets.SSH_HOST }}:2100" | head -3 2>/dev/null || true
              
              exit 0
            fi
            
            sleep 5
          done
          
          echo "⚠️ Could not verify from external network"
          echo "This might be due to:"
          echo "1. Firewall blocking port 2100"
          echo "2. Service still starting up"
          echo "3. Network latency"
          echo ""
          echo "Checking with SSH instead..."
          
          # بررسی از طریق SSH
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'CHECKEOF'
            echo "Checking service from inside the server..."
            curl -s -f http://localhost:2100 >/dev/null && \
            echo "✅ Service is running internally" || \
            echo "❌ Service not responding internally"
            
            echo "Docker status:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          CHECKEOF