name: Docker CI/CD Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH with proper formatting
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # روش مطمئن: استفاده از Heredoc برای حفظ فرمت کلید
          cat > ~/.ssh/id_ed25519 << 'KEYEOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          KEYEOF
          
          # حذف کاراکترهای اضافه و اصلاح خطوط
          sed -i 's/\\n/\n/g' ~/.ssh/id_ed25519
          sed -i 's/\"//g' ~/.ssh/id_ed25519
          sed -i 's/^[[:space:]]*//' ~/.ssh/id_ed25519
          sed -i '/^$/d' ~/.ssh/id_ed25519
          
          chmod 600 ~/.ssh/id_ed25519
          
          # نمایش اطلاعات کلید برای دیباگ
          echo "=== Key Information ==="
          ls -la ~/.ssh/id_ed25519
          echo "First line of key:"
          head -1 ~/.ssh/id_ed25519
          echo "Last line of key:"
          tail -1 ~/.ssh/id_ed25519
          echo "=== End Key Info ==="
          
          # افزودن هاست به known_hosts
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          
          # تست اتصال
          echo "Testing SSH connection..."
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "echo '✅ SSH Connection Successful!'; echo 'User: $(whoami)'; echo 'Directory: $(pwd)'"
      
      - name: Prepare files for deployment
        run: |
          # ایجاد فایل .tar برای انتقال آسان‌تر
          tar -czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='deploy.tar.gz' \
            .
          
          echo "Deployment package created: $(du -h deploy.tar.gz)"
      
      - name: Transfer files to server
        run: |
          # انتقال فایل tar به سرور
          scp -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              deploy.tar.gz \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
          
          # استخراج فایل‌ها روی سرور
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            echo "Extracting files in ${{ secrets.DEPLOY_PATH }}..."
            cd "${{ secrets.DEPLOY_PATH }}"
            
            # پشتیبان‌گیری از دایرکتوری فعلی (اختیاری)
            if [ -d "app_current" ]; then
              mv app_current "app_backup_$(date +%Y%m%d_%H%M%S)"
            fi
            
            # استخراج فایل‌های جدید
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz
            
            # در صورت نیاز، تغییر مالکیت فایل‌ها
            chown -R root:root . 2>/dev/null || true
            
            echo "Files extracted successfully!"
            ls -la
          EOF
      
      - name: Build and deploy Docker containers
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'DEPLOYEOF'
            set -e
            echo "🚀 Starting deployment process..."
            
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "\$DEPLOY_PATH"
            
            echo "📦 Building Docker image..."
            docker compose build --no-cache --pull
            
            echo "🛑 Stopping old containers..."
            docker compose down --remove-orphans --timeout 30 || true
            
            echo "▶️ Starting new containers..."
            docker compose up -d
            
            echo "⏳ Waiting for services to start..."
            sleep 10
            
            # بررسی سلامت سرویس
            echo "🏥 Health check..."
            MAX_RETRIES=15
            for i in \$(seq 1 \$MAX_RETRIES); do
              if curl -s -f http://localhost:2100 >/dev/null 2>&1; then
                echo "✅ Service is healthy! (Attempt \$i/\$MAX_RETRIES)"
                
                # نمایش اطلاعات اضافی
                echo "📊 Service info:"
                curl -s http://localhost:2100 | head -5
                
                break
              fi
              
              if [ \$i -eq \$MAX_RETRIES ]; then
                echo "❌ Service health check failed after \$MAX_RETRIES attempts"
                echo "📜 Container logs:"
                docker compose logs --tail=50
                exit 1
              fi
              
              echo "⏳ Waiting for service... (\$i/\$MAX_RETRIES)"
              sleep 3
            done
            
            # پاکسازی منابع قدیمی
            echo "🧹 Cleaning up old resources..."
            docker system prune -f --volumes || true
            
            # نمایش وضعیت نهایی
            echo "📈 Final status:"
            docker compose ps
            echo ""
            echo "🎉 Deployment completed successfully!"
            echo "🌐 Service is available at: http://${{ secrets.SSH_HOST }}:2100"
          DEPLOYEOF
      
      - name: Verify remote deployment
        run: |
          echo "Verifying remote deployment..."
          # تست دسترسی به سرویس از بیرون
          sleep 20
          if curl -s -f --max-time 30 "http://${{ secrets.SSH_HOST }}:2100"; then
            echo "✅ Remote verification successful!"
          else
            echo "⚠️ Could not verify from external network, but deployment might still be successful"
          fi