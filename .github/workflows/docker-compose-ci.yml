name: Docker CI/CD Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH with proper formatting
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # روش مطمئن: استفاده از Heredoc برای حفظ فرمت کلید
          cat > ~/.ssh/id_ed25519 << 'KEYEOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          KEYEOF
          
          # حذف کاراکترهای اضافه و اصلاح خطوط
          sed -i 's/\\n/\n/g' ~/.ssh/id_ed25519
          sed -i 's/\"//g' ~/.ssh/id_ed25519
          sed -i 's/^[[:space:]]*//' ~/.ssh/id_ed25519
          sed -i '/^$/d' ~/.ssh/id_ed25519
          
          chmod 600 ~/.ssh/id_ed25519
          
          # نمایش اطلاعات کلید برای دیباگ
          echo "=== Key Information ==="
          ls -la ~/.ssh/id_ed25519
          echo "First line of key:"
          head -1 ~/.ssh/id_ed25519
          echo "Last line of key:"
          tail -1 ~/.ssh/id_ed25519
          echo "=== End Key Info ==="
          
          # افزودن هاست به known_hosts
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          
          # تست اتصال
          echo "Testing SSH connection..."
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "echo '✅ SSH Connection Successful!'; echo 'User: $(whoami)'; echo 'Directory: $(pwd)'; echo 'Deploy path exists:' && [ -d '${{ secrets.DEPLOY_PATH }}' ] && echo 'Yes' || echo 'No'"
      
      - name: Create deployment directory on server
        run: |
          # ایجاد دایرکتوری اگر وجود ندارد
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "mkdir -p '${{ secrets.DEPLOY_PATH }}' && echo '✅ Directory created/verified: ${{ secrets.DEPLOY_PATH }}'"
      
      - name: Transfer files to server using rsync
        run: |
          # استفاده از rsync برای انتقال مستقیم فایل‌ها
          echo "Syncing files to server..."
          echo "Source: ./"
          echo "Destination: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"
          
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='*.log' \
            --exclude='deploy.tar.gz' \
            --exclude='.env' \
            --delete \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
          
          echo "✅ Files synced successfully!"
      
      - name: Deploy Docker containers on server
        run: |
          # استفاده از یک اسکریپت جداگانه برای deployment
          cat > deploy_script.sh << 'SCRIPTEOF'
          #!/bin/bash
          set -e
          
          echo "🚀 Starting deployment process..."
          
          # استفاده از مسیر مستقیم
          DEPLOY_PATH="$1"
          echo "Deployment path: \$DEPLOY_PATH"
          
          # رفتن به دایرکتوری
          cd "\$DEPLOY_PATH" || {
            echo "❌ Failed to change directory to: \$DEPLOY_PATH"
            echo "Current directory: \$(pwd)"
            echo "Directory contents:"
            ls -la
            exit 1
          }
          
          echo "📋 Current directory: \$(pwd)"
          echo "📁 Directory contents:"
          ls -la
          
          echo "🐳 Checking Docker..."
          docker --version
          
          # بررسی docker compose
          if docker compose version >/dev/null 2>&1; then
            COMPOSE_CMD="docker compose"
            echo "Using: docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_CMD="docker-compose"
            echo "Using: docker-compose"
          else
            echo "❌ docker compose not found!"
            exit 1
          fi
          
          echo "📦 Building Docker image..."
          \$COMPOSE_CMD build --no-cache
          
          echo "🛑 Stopping old containers..."
          \$COMPOSE_CMD down --remove-orphans --timeout 30 || true
          
          echo "▶️ Starting new containers..."
          \$COMPOSE_CMD up -d
          
          echo "⏳ Waiting for services to start..."
          sleep 15
          
          # بررسی سلامت سرویس
          echo "🏥 Health check..."
          MAX_RETRIES=20
          SERVICE_UP=false
          
          for i in \$(seq 1 \$MAX_RETRIES); do
            if curl -s -f http://localhost:2100 >/dev/null 2>&1; then
              echo "✅ Service is healthy! (Attempt \$i/\$MAX_RETRIES)"
              SERVICE_UP=true
              
              echo "📊 Service response:"
              curl -s -m 5 http://localhost:2100 | head -3 2>/dev/null || echo "No content preview"
              
              break
            fi
            
            echo "⏳ Waiting for service... (\$i/\$MAX_RETRIES)"
            sleep 3
          done
          
          if [ "\$SERVICE_UP" = "false" ]; then
            echo "⚠️ Service health check failed after \$MAX_RETRIES attempts"
            echo "📜 Container logs:"
            \$COMPOSE_CMD logs --tail=50 2>/dev/null || echo "Could not retrieve logs"
            
            echo "🐳 Docker containers:"
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          fi
          
          # پاکسازی
          echo "🧹 Cleaning up old resources..."
          docker system prune -f 2>/dev/null || true
          
          echo "📈 Final status:"
          \$COMPOSE_CMD ps 2>/dev/null || docker ps --filter "name=rasapolymer"
          
          echo ""
          echo "🎉 Deployment process completed!"
          echo "🌐 Service URL: http://localhost:2100"
          echo "🌐 External URL: http://$(hostname -I | awk '{print \$1}'):2100"
          SCRIPTEOF
          
          # انتقال اسکریپت به سرور
          scp -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              deploy_script.sh \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/deploy_script.sh
          
          # اجرای اسکریپت
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "chmod +x /tmp/deploy_script.sh && /tmp/deploy_script.sh '${{ secrets.DEPLOY_PATH }}'"
      
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          
          # صبر برای راه‌اندازی
          sleep 30
          
          # تست داخلی از طریق SSH
          echo "Checking from server internally..."
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'INTERNALEOF'
            echo "=== Internal check ==="
            
            # بررسی container
            echo "1. Docker containers:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -E "(rasapolymer|2100)" || echo "No matching containers found"
            
            # بررسی سرویس
            echo ""
            echo "2. Service check:"
            if curl -s -f --max-time 10 http://localhost:2100 >/dev/null; then
              echo "✅ Service is running internally"
              echo "Response sample:"
              curl -s -m 5 http://localhost:2100 | head -2 2>/dev/null || echo "No content"
            else
              echo "❌ Service not responding internally"
              echo "Trying alternative port..."
              netstat -tulpn | grep :210 || echo "No process listening on port 210*"
            fi
            
            # بررسی logs
            echo ""
            echo "3. Recent logs:"
            docker logs --tail=5 \$(docker ps -q --filter "name=rasapolymer") 2>/dev/null || echo "No logs available"
          INTERNALEOF
          
          # تست خارجی
          echo ""
          echo "=== External check ==="
          MAX_ATTEMPTS=10
          for i in \$(seq 1 \$MAX_ATTEMPTS); do
            echo "External attempt \$i/\$MAX_ATTEMPTS..."
            if curl -s -f --max-time 30 "http://${{ secrets.SSH_HOST }}:2100" >/dev/null 2>&1; then
              echo "✅ External verification successful!"
              echo "Service is accessible from internet"
              curl -s -m 10 "http://${{ secrets.SSH_HOST }}:2100" | head -3 2>/dev/null || true
              exit 0
            fi
            sleep 6
          done
          
          echo "⚠️ Could not verify externally after \$MAX_ATTEMPTS attempts"
          echo "Possible reasons:"
          echo "1. Firewall blocking port 2100"
          echo "2. Service still starting"
          echo "3. Network issues"
          echo ""
          echo "Checking firewall status..."
          
          # بررسی firewall
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "echo 'Firewall status:'; sudo ufw status 2>/dev/null || echo 'ufw not installed'; echo 'Listening ports:'; sudo netstat -tulpn | grep :210"