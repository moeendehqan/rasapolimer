name: Docker CI/CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Start SSH agent
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
          
          # Add host to known_hosts
          ssh-keyscan -t ed25519 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          
          # Test connection
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo Connected!"
      
      - name: Copy files
        run: |
          scp -o StrictHostKeyChecking=no -r \
            --exclude='.git' \
            --exclude='node_modules' \
            ./* ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
      
      - name: Run deploy script
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash -s" << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Stop and clean
            docker compose down || true
            
            # Build and run
            docker compose build
            docker compose up -d
            
            # Check status
            sleep 5
            docker compose ps
            
            # Verify
            curl -f http://localhost:2100 || echo "Service check failed but continuing"
          EOF