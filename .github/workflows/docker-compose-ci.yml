name: Docker Compose CI/CD

permissions:
  contents: read

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Build and test locally
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
          
      - name: Wait for service
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:2100 >/dev/null; then
              echo "Service is up!"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
          
      - name: Show test output
        run: |
          curl -fsS http://localhost:2100 | head -n 20 || true
          
      - name: Teardown
        if: always()
        run: |
          docker compose logs --tail=100
          docker compose down -v

  deploy:
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      
      - name: Copy files to server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
      
      - name: Build and deploy on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Stop and remove old containers
            docker compose down --remove-orphans || true
            
            # Clean old images to save space
            docker system prune -f || true
            
            # Build new image locally on server
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml build --no-cache
            
            # Start services
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d
            
            # Wait for service to be ready
            sleep 5
            for i in \$(seq 1 30); do
              if curl -fsS http://localhost:2100 >/dev/null; then
                echo 'Service started successfully!'
                break
              fi
              sleep 2
            done
            
            # Show service status
            docker compose ps
            echo 'Deployment completed!'
          "
      
      - name: Verify deployment
        run: |
          sleep 10
          curl -fsS http://${{ secrets.SSH_HOST }}:2100 || true